[package]
name = "btd"
version = "1.1.5"
authors = ["Brandon Fowler"]
edition = "2021"
description = "CLI tool to transform and deploy production builds of projects with file operations and commands"
documentation = "https://brandonxlf.github.io/btd/"
repository = "https://github.com/BrandonXLF/btd"
license = "GPL-3.0-or-later"
keywords = ["cli", "build", "deploy", "deployment", "automation"]
categories = ["command-line-utilities", "development-tools::build-utils"]
exclude = [".*"]

[dependencies]
dirs = "5.0.1"
edit = "0.1.5"
open = "5.1.2"
regex = "1.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.33"
system = "0.3.0"

[build-dependencies]
winres = "0.1.12"
